<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Gemini2API - Chat Gemini &amp; AI Studio Bridge</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f172a;
    --card: #1e293b;
    --fg: #f8fafc;
    --muted: #94a3b8;
    --line: #334155;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --ok: #10b981;
    --warn: #f59e0b;
    --bad: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 370px;
    padding: 16px;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--fg);
    background: var(--bg);
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(59, 130, 246, 0.2);
    color: #60a5fa;
  }
  .status-box {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0;
  }
  .status-row + .status-row {
    border-top: 1px solid rgba(255,255,255,0.06);
    margin-top: 4px;
    padding-top: 8px;
  }
  .status-label {
    color: var(--muted);
    font-size: 12px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
  }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }

  .mode-box {
    margin-bottom: 10px;
  }
  .mode-box label {
    margin: 0 0 4px;
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 600;
  }
  select {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--card);
    color: var(--fg);
    font: 12.5px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  button {
    width: 100%;
    padding: 10px 12px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.55; cursor: default; }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
  }
  .btn-secondary {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--fg);
    font-weight: 500;
    padding: 8px 10px;
    font-size: 12px;
  }
  .btn-secondary:hover {
    background: #283548;
  }
  .btn-full {
    margin-top: 8px;
  }

  details {
    margin-top: 12px;
    border-top: 1px solid var(--line);
    padding-top: 8px;
  }
  summary {
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  label {
    display: block;
    margin: 8px 0 3px;
    font-size: 11px;
    color: var(--muted);
  }
  input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--card);
    color: var(--fg);
    font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #log {
    margin-top: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--line);
    font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    word-break: break-word;
    display: none;
  }
  #log.show { display: block; }
  #log.ok { border-color: rgba(16, 185, 129, 0.5); color: #34d399; }
  #log.bad { border-color: rgba(239, 68, 68, 0.5); color: #f87171; }
</style>
</head>
<body>
  <div class="header">
    <h1>Gemini2API Bridge</h1>
    <span class="badge">Chat Gemini (Chính)</span>
  </div>

  <div class="status-box">
    <div class="status-row">
      <span class="status-label">Kết nối Gemini2API</span>
      <span class="pill" id="wsStatus">
        <span class="dot" id="wsDot"></span>
        <span id="wsText">Đang kiểm tra...</span>
      </span>
    </div>
    <div class="status-row">
      <span class="status-label">Phiên đăng nhập Google</span>
      <span class="pill" id="cookieStatus">
        <span class="dot" id="cookieDot"></span>
        <span id="cookieText">Đang kiểm tra...</span>
      </span>
    </div>
    <div class="status-row">
      <span class="status-label">Tab Chat Gemini (Chính)</span>
      <span class="pill" id="geminiTabText">0 tab</span>
    </div>
    <div class="status-row">
      <span class="status-label">Tab AI Studio (Phụ)</span>
      <span class="pill" id="aiStudioTabText">0 tab</span>
    </div>
  </div>

  <div class="mode-box">
    <label for="upstreamMode">Nguồn thực thi (Upstream Mode)</label>
    <select id="upstreamMode">
      <option value="gemini">💬 Chat Gemini (gemini.google.com) — Chính (Mặc định)</option>
      <option value="aistudio">🧪 Google AI Studio (aistudio.google.com) — Phụ</option>
    </select>
  </div>

  <button id="syncBtn" type="button">⚡ Kết nối &amp; Đồng bộ ngay</button>

  <div class="btn-row">
    <button id="openGeminiBtn" class="btn-secondary" type="button">💬 Mở Chat Gemini (Chính)</button>
    <button id="openAiStudioBtn" class="btn-secondary" type="button">🧪 Mở AI Studio (Phụ)</button>
  </div>
  <button id="openDashboardBtn" class="btn-secondary btn-full" type="button">📊 Mở Web Dashboard</button>

  <div id="log"></div>

  <details>
    <summary>Cấu hình nâng cao (Server URL)</summary>
    <label for="serverUrl">Địa chỉ Gemini2API Server</label>
    <input id="serverUrl" type="url" placeholder="http://127.0.0.1:18610" spellcheck="false">
    <label for="label">Nhãn tài khoản (tuỳ chọn)</label>
    <input id="label" type="text" placeholder="Chrome Chat Gemini">
    <label for="adminKey">Admin Key (để trống khi chạy local)</label>
    <input id="adminKey" type="password" placeholder="Không bắt buộc ở chế độ Local" spellcheck="false">
  </details>

  <script src="popup.js"></script>
</body>
</html>
